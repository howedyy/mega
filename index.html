<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mega Project - Secure Access Portal">
    <meta name="keywords" content="login, authentication, access, portal">
    <meta name="author" content="Mega Project Team">
    
    <title>Mega Project - Secure Access</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
    
    <!-- Meta redirect to login page -->
    <meta http-equiv="refresh" content="0;url=login.html">
    
    <style>
        .redirect-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .redirect-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body class="redirect-container d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card redirect-card shadow-lg text-center p-4">
                    <div class="card-body">
                        <!-- Company Logo -->
                        <img src="assets/logo.png" alt="Mega Project Logo" height="60" class="mb-3">
                        
                        <h3 class="text-primary mb-3">
                            <i class="fas fa-shield-alt me-2"></i>
                            Secure Access Portal
                        </h3>
                        
                        <p class="text-muted mb-4">Redirecting to login page...</p>
                        
                        <!-- Loading Spinner -->
                        <div class="spinner-border text-primary loading-spinner mb-3" role="status" aria-label="Loading">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        
                        <div class="text-muted small">
                            <p class="mb-1">
                                <i class="fas fa-lock me-1"></i>
                                Authentication required
                            </p>
                            <p class="mb-0">
                                If not redirected automatically, 
                                <a href="login.html" class="text-primary text-decoration-none">click here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript redirect as backup -->
    <script>
        // Immediate redirect to login page
        window.location.replace('login.html');
        
        // Fallback timeout redirect
        setTimeout(function() {
            if (window.location.href.indexOf('login.html') === -1) {
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
